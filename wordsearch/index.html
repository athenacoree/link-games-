<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopa de Letras - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }
    .word-list {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .word-tag {
      padding: 0.35rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .word-tag.found { background: #10b981; color: white; border-color: #10b981; }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
    }
    .cell {
      aspect-ratio: 1;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
    }
    .cell.selected { background: var(--accent-primary); color: white; }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">🔠</div>
      <span>Sopa de Letras</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div class="word-list">
        <span class="word-tag" id="tag-LINK">LINK</span>
        <span class="word-tag" id="tag-GAME">GAME</span>
        <span class="word-tag" id="tag-PLAY">PLAY</span>
      </div>

      <div class="grid" id="grid"></div>

      <button class="btn btn-primary" onclick="initGame()" style="width: 100%;">Nueva Sopa</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames</p></footer>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const SIZE = 8;
    const words = ["LINK", "GAME", "PLAY"];
    let gridData = [];
    let foundWords = [];

    function initGame() {
      foundWords = [];
      words.forEach(w => document.getElementById(`tag-${w}`).classList.remove('found'));

      gridData = Array(SIZE).fill(null).map(() =>
        Array(SIZE).fill(null).map(() => alphabet[Math.floor(Math.random() * alphabet.length)])
      );

      // Embed LINK horizontally row 0
      "LINK".split("").forEach((ch, idx) => gridData[0][idx] = ch);
      // Embed GAME horizontally row 2
      "GAME".split("").forEach((ch, idx) => gridData[2][idx + 2] = ch);
      // Embed PLAY vertically col 7
      "PLAY".split("").forEach((ch, idx) => gridData[idx + 1][7] = ch);

      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = gridData[r][c];
          cell.addEventListener('click', () => {
            cell.classList.toggle('selected');
            checkWord();
          });
          grid.appendChild(cell);
        }
      }
    }

    function checkWord() {
      const selected = Array.from(document.querySelectorAll('.cell.selected')).map(c => c.textContent).join('');
      words.forEach(w => {
        if (selected.includes(w) && !foundWords.includes(w)) {
          foundWords.push(w);
          document.getElementById(`tag-${w}`).classList.add('found');
          if (foundWords.length === words.length) {
            setTimeout(() => alert("🎉 ¡Encontraste todas las palabras!"), 100);
          }
        }
      });
    }

    initGame();
  </script>
</body>
</html>
