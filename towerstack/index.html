<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre de Bloques - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }
    .canvas-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #090d16;
      border-radius: var(--radius-md);
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">🏗️</div>
      <span>Torre de Bloques</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div style="margin-bottom:1rem; font-size:1.25rem; font-weight:bold;">
        Bloques Apilados: <span id="score" style="color:var(--accent-primary);">0</span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="towerCanvas" width="360" height="480"></canvas>
      </div>

      <button class="btn btn-primary" id="btnDrop" style="width: 100%; height: 50px; font-size: 1.1rem;">🧱 Soltar Bloque (Tap / Espacio)</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames</p></footer>

  <script>
    const canvas = document.getElementById('towerCanvas');
    const ctx = canvas.getContext('2d');

    let stack = [];
    let currentBlock = { x: 0, width: 140, speed: 3, dir: 1 };
    let score = 0;
    let gameActive = false;

    function initGame() {
      stack = [{ x: 110, width: 140, y: 440 }];
      currentBlock = { x: 0, width: 140, speed: 3, dir: 1 };
      score = 0;
      document.getElementById('score').textContent = score;
      gameActive = true;
      loop();
    }

    function dropBlock() {
      if (!gameActive) return;

      const prev = stack[stack.length - 1];
      const diff = currentBlock.x - prev.x;

      if (Math.abs(diff) >= currentBlock.width) {
        alert(`💥 ¡Se cayó la torre! Apilaste ${score} bloques.`);
        gameActive = false;
        return;
      }

      const newWidth = currentBlock.width - Math.abs(diff);
      const newX = diff > 0 ? currentBlock.x : prev.x;

      stack.push({ x: newX, width: newWidth, y: 440 - stack.length * 24 });
      score++;
      document.getElementById('score').textContent = score;

      currentBlock.width = newWidth;
      currentBlock.x = 0;
      currentBlock.speed += 0.2;
    }

    function loop() {
      if (!gameActive) return;

      currentBlock.x += currentBlock.speed * currentBlock.dir;
      if (currentBlock.x + currentBlock.width > canvas.width || currentBlock.x < 0) {
        currentBlock.dir *= -1;
      }

      // Draw
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const offsetY = Math.max(0, (stack.length - 12) * 24);

      // Stacked blocks
      stack.forEach((b, i) => {
        ctx.fillStyle = `hsl(${(i * 20) % 360}, 80%, 60%)`;
        ctx.fillRect(b.x, b.y + offsetY, b.width, 22);
      });

      // Moving block
      const currentY = 440 - stack.length * 24 + offsetY;
      ctx.fillStyle = `hsl(${(stack.length * 20) % 360}, 80%, 60%)`;
      ctx.fillRect(currentBlock.x, currentY, currentBlock.width, 22);

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') dropBlock(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); dropBlock(); });
    document.getElementById('btnDrop').addEventListener('click', dropBlock);

    initGame();
  </script>
</body>
</html>
