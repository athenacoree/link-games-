<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecanografía Veloz - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .word-display {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--accent-primary);
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    .type-input {
      width: 100%;
      padding: 1rem;
      font-size: 1.25rem;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      color: white;
      text-align: center;
      margin-bottom: 1.5rem;
      outline: none;
    }
    .type-input:focus { border-color: var(--accent-primary); }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">⌨️</div>
      <span>Mecanografía Veloz</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div class="stats-bar">
        <div>PPM (Palabras/Min): <strong id="wpm" style="color:var(--accent-primary);">0</strong></div>
        <div>Tiempo: <strong id="timer">30s</strong></div>
      </div>

      <div class="word-display" id="wordBox">Palabra</div>

      <input type="text" class="type-input" id="typeInput" placeholder="Escribe aquí la palabra..." autocomplete="off">

      <button class="btn btn-primary" onclick="initGame()" style="width: 100%;">Iniciar Reto</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames</p></footer>

  <script>
    const WORDS = ["LINK", "CODIGO", "PLATAFORMA", "MINIJUEGOS", "RAPIDO", "MECANOGRAFIA", "TECLADO", "NUBE", "ESTATICO", "DESARROLLO", "VELOCIDAD", "PANTALLA", "DESAFIANTE"];
    let currentWord = "";
    let wordCount = 0;
    let timeLeft = 30;
    let timer = null;

    function initGame() {
      clearInterval(timer);
      wordCount = 0;
      timeLeft = 30;
      document.getElementById('wpm').textContent = '0';
      document.getElementById('timer').textContent = '30s';
      document.getElementById('typeInput').value = '';
      document.getElementById('typeInput').focus();

      nextWord();

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          alert(`🎉 ¡Tiempo terminado! Escribiste ${wordCount} palabras (${wordCount * 2} PPM).`);
        }
      }, 1000);
    }

    function nextWord() {
      currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      document.getElementById('wordBox').textContent = currentWord;
    }

    document.getElementById('typeInput').addEventListener('input', (e) => {
      if (e.target.value.trim().toUpperCase() === currentWord) {
        wordCount++;
        document.getElementById('wpm').textContent = wordCount * 2;
        e.target.value = '';
        nextWord();
      }
    });
  </script>
</body>
</html>
