<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salto Infinito - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }
    .canvas-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px;
      margin-bottom: 1.5rem;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #0b1329;
      border-radius: var(--radius-md);
      display: block;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .ctrl-btn {
      flex: 1;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">🦘</div>
      <span>Salto Infinito</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div style="margin-bottom:1rem; font-weight:bold;">Altura: <span id="score" style="color:var(--accent-primary);">0</span>m</div>

      <div class="canvas-wrapper">
        <canvas id="doodleCanvas" width="360" height="480"></canvas>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btnLeft">◄ Izquierda</button>
        <button class="ctrl-btn" id="btnRight">► Derecha</button>
      </div>

      <button class="btn btn-primary" onclick="initGame()" style="width: 100%;">Iniciar Salto</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames</p></footer>

  <script>
    const canvas = document.getElementById('doodleCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 160, y: 300, vx: 0, vy: -9, radius: 12 };
    let platforms = [];
    let score = 0;
    let gameActive = false;

    function initGame() {
      player = { x: 160, y: 300, vx: 0, vy: -9, radius: 12 };
      platforms = [];
      for (let i = 0; i < 7; i++) {
        platforms.push({ x: Math.random() * 280, y: i * 70 + 40, w: 70, h: 12 });
      }
      score = 0;
      document.getElementById('score').textContent = score;
      gameActive = true;
      loop();
    }

    function loop() {
      if (!gameActive) return;

      player.vy += 0.35;
      player.x += player.vx;
      player.y += player.vy;

      // Wrap around walls
      if (player.x < 0) player.x = canvas.width;
      if (player.x > canvas.width) player.x = 0;

      // Platform bounce
      platforms.forEach(p => {
        if (
          player.vy > 0 &&
          player.x > p.x && player.x < p.x + p.w &&
          player.y + player.radius > p.y && player.y + player.radius < p.y + p.h
        ) {
          player.vy = -10;
        }
      });

      // Scroll camera
      if (player.y < 200) {
        let diff = 200 - player.y;
        player.y = 200;
        score += Math.floor(diff);
        document.getElementById('score').textContent = score;
        platforms.forEach(p => {
          p.y += diff;
          if (p.y > canvas.height) {
            p.y = 0;
            p.x = Math.random() * 280;
          }
        });
      }

      if (player.y > canvas.height) {
        alert(`💥 Game Over! Alcanzaste una altura de ${score}m.`);
        gameActive = false;
        return;
      }

      // Draw
      ctx.fillStyle = '#0b1329';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#10b981';
      platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    document.getElementById('btnLeft').addEventListener('click', () => player.vx = -5);
    document.getElementById('btnRight').addEventListener('click', () => player.vx = 5);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') player.vx = -5;
      if (e.key === 'ArrowRight') player.vx = 5;
    });

    initGame();
  </script>
</body>
</html>
