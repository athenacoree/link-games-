<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Link Pro - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 460px;
      margin: 0 auto;
      text-align: center;
    }
    .canvas-wrapper {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-glow);
      margin-bottom: 1.5rem;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #090d16;
      border-radius: var(--radius-md);
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">🐤</div>
      <span>Flappy Link Pro</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div class="super-hud">
        <div class="super-stat-box">
          <div class="super-stat-label">Puntos</div>
          <div class="super-stat-value" id="score">0</div>
        </div>
        <div class="super-stat-box">
          <div class="super-stat-label">Escudo</div>
          <div class="super-stat-value" id="shieldState" style="color:#10b981; font-size:1.1rem;">Inactivo</div>
        </div>
        <div class="super-stat-box">
          <div class="super-stat-label">Récord</div>
          <div class="super-stat-value" id="highScore" style="color: #ec4899;">0</div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="flappyCanvas" width="360" height="500"></canvas>
      </div>

      <button class="btn btn-primary" id="btnTap" style="width: 100%; height: 50px; font-size: 1.1rem;">🚀 Aletear / Saltar (Espacio / Tap)</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames Super Edition</p></footer>

  <script src="../assets/js/super-engine.js"></script>
  <script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');

    const stats = new window.SuperEngine.Stats('flappy');
    const particles = new window.SuperEngine.ParticleSystem(ctx);

    let bird = { x: 60, y: 200, radius: 13, velocity: 0, gravity: 0.42, jump: -7.2, hasShield: false };
    let pipes = [];
    let coins = [];
    let frame = 0;
    let score = 0;
    let gameRunning = false;

    document.getElementById('highScore').textContent = stats.data.highScore;

    function resetGame() {
      window.SuperEngine.Audio.init();
      bird.y = 200;
      bird.velocity = 0;
      bird.hasShield = false;
      document.getElementById('shieldState').textContent = 'Inactivo';
      document.getElementById('shieldState').style.color = '#cbd5e1';
      pipes = [];
      coins = [];
      frame = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      gameRunning = true;
    }

    function flap() {
      window.SuperEngine.Audio.init();
      if (!gameRunning) {
        resetGame();
      } else {
        bird.velocity = bird.jump;
        window.SuperEngine.Audio.play('jump');
        particles.burst(bird.x - 10, bird.y + 5, '#f59e0b', 6, 2);
      }
    }

    function spawnCoin(x, topY, bottomY) {
      if (Math.random() < 0.6) {
        const type = Math.random() < 0.25 ? 'shield' : 'coin';
        coins.push({
          x: x + 24,
          y: topY + (canvas.height - topY - bottomY) / 2,
          radius: 9,
          type: type
        });
      }
    }

    function loop() {
      // Dynamic Day/Night Background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameRunning) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Spawn Pipes
        if (frame % 85 === 0) {
          let gap = 125;
          let top = Math.floor(Math.random() * (canvas.height - gap - 120)) + 40;
          let bottom = canvas.height - top - gap;
          pipes.push({ x: canvas.width, top: top, bottom: bottom, passed: false });
          spawnCoin(canvas.width, top, bottom);
        }

        // Process Pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          let p = pipes[i];
          p.x -= 2.6;

          // Draw Pipes with Neon Glow
          ctx.save();
          ctx.fillStyle = '#10b981';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#10b981';
          ctx.fillRect(p.x, 0, 48, p.top);
          ctx.fillRect(p.x, canvas.height - p.bottom, 48, p.bottom);
          ctx.restore();

          // Pipe Collision check
          if (
            bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 48 &&
            (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom)
          ) {
            if (bird.hasShield) {
              bird.hasShield = false;
              document.getElementById('shieldState').textContent = 'Inactivo';
              document.getElementById('shieldState').style.color = '#cbd5e1';
              window.SuperEngine.Audio.play('hit');
              window.SuperEngine.shakeCanvas(canvas, 10, 200);
              pipes.splice(i, 1);
              continue;
            } else {
              gameOver();
            }
          }

          if (p.x + 48 < bird.x && !p.passed) {
            p.passed = true;
            score++;
            document.getElementById('score').textContent = score;
            window.SuperEngine.Audio.play('score');

            if (score > stats.data.highScore) {
              stats.data.highScore = score;
              stats.save();
              document.getElementById('highScore').textContent = score;
            }

            if (score >= 20) stats.unlockAchievement('flappy_20', 'Aviador Experto', 'Consigue 20 puntos en Flappy Link Pro');
          }

          if (p.x < -50) pipes.splice(i, 1);
        }

        // Process Coins/Shield Powerups
        for (let i = coins.length - 1; i >= 0; i--) {
          let c = coins[i];
          c.x -= 2.6;

          ctx.save();
          ctx.shadowBlur = 12;
          if (c.type === 'shield') {
            ctx.fillStyle = '#3b82f6';
            ctx.shadowColor = '#3b82f6';
          } else {
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
          }

          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Collect check
          if (Math.hypot(bird.x - c.x, bird.y - c.y) < bird.radius + c.radius) {
            if (c.type === 'shield') {
              bird.hasShield = true;
              document.getElementById('shieldState').textContent = '🛡️ ACTIVO';
              document.getElementById('shieldState').style.color = '#3b82f6';
              window.SuperEngine.Audio.play('powerup');
              particles.burst(c.x, c.y, '#3b82f6', 15, 4);
            } else {
              score += 2;
              document.getElementById('score').textContent = score;
              window.SuperEngine.Audio.play('eat');
              particles.burst(c.x, c.y, '#f59e0b', 12, 4);
              particles.addFloatingText('+2', c.x, c.y - 10, '#f59e0b');
            }
            coins.splice(i, 1);
          } else if (c.x < -20) {
            coins.splice(i, 1);
          }
        }

        // Boundary check
        if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
          gameOver();
        }

        frame++;
      } else {
        ctx.fillStyle = '#a5b4fc';
        ctx.font = 'bold 18px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('¡Toca o pulsa Espacio para volar! 🚀', canvas.width / 2, canvas.height / 2);
      }

      // Draw Bird
      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = bird.hasShield ? '#3b82f6' : '#f59e0b';
      ctx.fillStyle = bird.hasShield ? '#60a5fa' : '#f59e0b';
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bird.x + 4, bird.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      particles.update();
      particles.draw();

      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameRunning = false;
      window.SuperEngine.Audio.play('gameover');
      window.SuperEngine.shakeCanvas(canvas, 10, 300);
      stats.recordGame(score);
    }

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') flap(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });
    canvas.addEventListener('mousedown', flap);
    document.getElementById('btnTap').addEventListener('click', flap);

    loop();
  </script>
</body>
</html>
