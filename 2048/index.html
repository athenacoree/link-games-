<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Puzzle - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      padding: 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .score-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .grid-container {
      background: #0f172a;
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      aspect-ratio: 1;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      touch-action: none;
    }

    .tile {
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 800;
      color: white;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .tile[data-value="2"] { background: #334155; color: #f8fafc; }
    .tile[data-value="4"] { background: #475569; color: #f8fafc; }
    .tile[data-value="8"] { background: #f97316; color: white; }
    .tile[data-value="16"] { background: #ea580c; color: white; }
    .tile[data-value="32"] { background: #ef4444; color: white; }
    .tile[data-value="64"] { background: #dc2626; color: white; }
    .tile[data-value="128"] { background: #eab308; color: white; font-size: 1.5rem; }
    .tile[data-value="256"] { background: #ca8a04; color: white; font-size: 1.5rem; }
    .tile[data-value="512"] { background: #84cc16; color: white; font-size: 1.5rem; }
    .tile[data-value="1024"] { background: #10b981; color: white; font-size: 1.25rem; }
    .tile[data-value="2048"] { background: #6366f1; color: white; font-size: 1.25rem; box-shadow: 0 0 15px rgba(99,102,241,0.6); }

    .instructions {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <header class="link-header">
    <a href="../" class="btn-back">
      <span>← Volver al Catálogo</span>
    </a>
    <div class="link-logo">
      <div class="link-logo-icon">🔢</div>
      <span>2048 Puzzle</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">

      <div class="score-board">
        <div>
          <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Puntos</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div>
          <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Mejor</div>
          <div class="score-val" id="bestScore" style="color:#ec4899;">0</div>
        </div>
      </div>

      <div class="grid-container" id="grid">
        <!-- 16 tiles generated by JS -->
      </div>

      <div class="instructions">
        📱 Desliza con el dedo o usa las flechas del teclado para unir las fichas.
      </div>

      <button class="btn btn-secondary" id="btnRestart" style="width: 100%;">Nueva Partida</button>

    </div>
  </main>

  <footer class="link-footer">
    <p>Licencia MIT — Link Minigames</p>
  </footer>

  <script>
    const SIZE = 4;
    let board = [];
    let score = 0;
    let bestScore = localStorage.getItem('2048_best') || 0;

    const gridEl = document.getElementById('grid');
    document.getElementById('bestScore').textContent = bestScore;

    function initGame() {
      board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      document.getElementById('score').textContent = score;
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      let emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length > 0) {
        const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = board[r][c];
          const tile = document.createElement('div');
          tile.classList.add('tile');
          if (val > 0) {
            tile.dataset.value = val;
            tile.textContent = val;
          }
          gridEl.appendChild(tile);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(val => val !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val !== 0);
      while (arr.length < SIZE) arr.push(0);
      return arr;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < SIZE; r++) {
        const newRow = slide(board[r]);
        if (JSON.stringify(newRow) !== JSON.stringify(board[r])) moved = true;
        board[r] = newRow;
      }
      return moved;
    }

    function moveRight() {
      let moved = false;
      for (let r = 0; r < SIZE; r++) {
        const reversed = [...board[r]].reverse();
        const newRow = slide(reversed).reverse();
        if (JSON.stringify(newRow) !== JSON.stringify(board[r])) moved = true;
        board[r] = newRow;
      }
      return moved;
    }

    function moveUp() {
      let moved = false;
      for (let c = 0; c < SIZE; c++) {
        let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
        let newCol = slide(col);
        for (let r = 0; r < SIZE; r++) {
          if (board[r][c] !== newCol[r]) moved = true;
          board[r][c] = newCol[r];
        }
      }
      return moved;
    }

    function moveDown() {
      let moved = false;
      for (let c = 0; c < SIZE; c++) {
        let col = [board[0][c], board[1][c], board[2][c], board[3][c]].reverse();
        let newCol = slide(col).reverse();
        for (let r = 0; r < SIZE; r++) {
          if (board[r][c] !== newCol[r]) moved = true;
          board[r][c] = newCol[r];
        }
      }
      return moved;
    }

    function handleMove(direction) {
      let moved = false;
      if (direction === 'left') moved = moveLeft();
      if (direction === 'right') moved = moveRight();
      if (direction === 'up') moved = moveUp();
      if (direction === 'down') moved = moveDown();

      if (moved) {
        addRandomTile();
        document.getElementById('score').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('2048_best', bestScore);
          document.getElementById('bestScore').textContent = bestScore;
        }
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) return;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return;
        }
      }
      alert(`💥 ¡Fin del juego! Lograste una puntuación de ${score}.`);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') handleMove('left');
      if (e.key === 'ArrowRight') handleMove('right');
      if (e.key === 'ArrowUp') handleMove('up');
      if (e.key === 'ArrowDown') handleMove('down');
    });

    // Touch events
    let touchStartX = 0;
    let touchStartY = 0;

    gridEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    gridEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) handleMove('right');
        else if (diffX < -30) handleMove('left');
      } else {
        if (diffY > 30) handleMove('down');
        else if (diffY < -30) handleMove('up');
      }
    });

    document.getElementById('btnRestart').addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
