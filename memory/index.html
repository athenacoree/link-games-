<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Memoria Pro - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      user-select: none;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
    }

    .card.matched {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .card-front, .card-back {
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-md);
    }

    .card-front {
      background: var(--bg-secondary);
      color: var(--text-muted);
    }

    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

  <header class="link-header">
    <a href="../" class="btn-back">
      <span>← Volver al Catálogo</span>
    </a>
    <div class="link-logo">
      <div class="link-logo-icon">🃏</div>
      <span>Memoria Pro</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">

      <div class="super-hud">
        <div class="super-stat-box">
          <div class="super-stat-label">Movimientos</div>
          <div class="super-stat-value" id="moveCount">0</div>
        </div>
        <div class="super-stat-box">
          <div class="super-stat-label">Combo</div>
          <div class="super-stat-value" id="combo" style="color: #f59e0b;">x1</div>
        </div>
        <div class="super-stat-box">
          <div class="super-stat-label">Parejas</div>
          <div class="super-stat-value" id="pairsCount" style="color: #10b981;">0 / 8</div>
        </div>
        <div class="super-stat-box">
          <div class="super-stat-label">Tiempo</div>
          <div class="super-stat-value" id="timer" style="color: #ec4899;">0s</div>
        </div>
      </div>

      <div class="memory-grid" id="memoryGrid"></div>

      <button class="btn btn-secondary" id="btnRestart" style="width: 100%;">Reiniciar Juego</button>

    </div>
  </main>

  <footer class="link-footer">
    <p>Licencia MIT — Link Minigames Super Edition</p>
  </footer>

  <script src="../assets/js/super-engine.js"></script>
  <script>
    const stats = new window.SuperEngine.Stats('memory');

    const emojis = ['🚀', '👾', '🎮', '🕹️', '🎨', '⚡', '🔥', '💎'];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let combo = 1;
    let timer = 0;
    let timerInterval = null;
    let gameStarted = false;

    const grid = document.getElementById('memoryGrid');

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      moves = 0;
      combo = 1;
      matchedPairs = 0;
      gameStarted = false;
      flippedCards = [];

      document.getElementById('moveCount').textContent = moves;
      document.getElementById('combo').textContent = 'x1';
      document.getElementById('pairsCount').textContent = `0 / ${emojis.length}`;
      document.getElementById('timer').textContent = '0s';

      const cardDeck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

      grid.innerHTML = cardDeck.map((emoji, idx) => `
        <div class="card" data-idx="${idx}" data-emoji="${emoji}">
          <div class="card-front">❓</div>
          <div class="card-back">${emoji}</div>
        </div>
      `).join('');

      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => handleCardClick(card));
      });
    }

    function startTimer() {
      if (gameStarted) return;
      gameStarted = true;
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('timer').textContent = `${timer}s`;
      }, 1000);
    }

    function handleCardClick(card) {
      window.SuperEngine.Audio.init();
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) {
        return;
      }

      startTimer();
      card.classList.add('flipped');
      window.SuperEngine.Audio.play('pop');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moveCount').textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const emoji1 = card1.dataset.emoji;
      const emoji2 = card2.dataset.emoji;

      if (emoji1 === emoji2) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;

        if (combo > 1) {
          window.SuperEngine.Audio.play('combo');
        } else {
          window.SuperEngine.Audio.play('eat');
        }

        combo++;
        document.getElementById('combo').textContent = `x${combo}`;
        document.getElementById('pairsCount').textContent = `${matchedPairs} / ${emojis.length}`;
        flippedCards = [];

        if (matchedPairs === emojis.length) {
          clearInterval(timerInterval);
          window.SuperEngine.Audio.play('win');
          stats.recordGame(100 - moves, combo);

          if (moves <= 12) {
            stats.unlockAchievement('memory_master', 'Mente Fotográfica', 'Completa el Juego de Memoria en 12 movimientos o menos');
          }

          setTimeout(() => {
            alert(`🎉 ¡Felicidades! Completaste el juego en ${moves} movimientos y ${timer} segundos.`);
          }, 300);
        }
      } else {
        combo = 1;
        document.getElementById('combo').textContent = 'x1';
        window.SuperEngine.Audio.play('bounce');

        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
        }, 800);
      }
    }

    document.getElementById('btnRestart').addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
