<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Memoria - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      padding: 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      user-select: none;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
    }

    .card.matched {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
    }

    .card-front, .card-back {
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-md);
    }

    .card-front {
      background: var(--bg-secondary);
      color: var(--text-muted);
    }

    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

  <header class="link-header">
    <a href="../" class="btn-back">
      <span>← Volver al Catálogo</span>
    </a>
    <div class="link-logo">
      <div class="link-logo-icon">🃏</div>
      <span>Juego de Memoria</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">Movimientos</span>
          <span class="stat-value" id="moveCount">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Parejas</span>
          <span class="stat-value" id="pairsCount">0 / 8</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Tiempo</span>
          <span class="stat-value" id="timer">0s</span>
        </div>
      </div>

      <div class="memory-grid" id="memoryGrid"></div>

      <button class="btn btn-secondary" id="btnRestart" style="width: 100%;">Reiniciar Juego</button>

    </div>
  </main>

  <footer class="link-footer">
    <p>Licencia MIT — Link Minigames</p>
  </footer>

  <script>
    const emojis = ['🚀', '👾', '🎮', '🕹️', '🎨', '⚡', '🔥', '💎'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = 0;
    let timerInterval = null;
    let gameStarted = false;

    const grid = document.getElementById('memoryGrid');

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      moves = 0;
      matchedPairs = 0;
      gameStarted = false;
      flippedCards = [];

      document.getElementById('moveCount').textContent = moves;
      document.getElementById('pairsCount').textContent = `0 / ${emojis.length}`;
      document.getElementById('timer').textContent = '0s';

      const cardDeck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

      grid.innerHTML = cardDeck.map((emoji, idx) => `
        <div class="card" data-idx="${idx}" data-emoji="${emoji}">
          <div class="card-front">❓</div>
          <div class="card-back">${emoji}</div>
        </div>
      `).join('');

      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => handleCardClick(card));
      });
    }

    function startTimer() {
      if (gameStarted) return;
      gameStarted = true;
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('timer').textContent = `${timer}s`;
      }, 1000);
    }

    function handleCardClick(card) {
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) {
        return;
      }

      startTimer();
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moveCount').textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const emoji1 = card1.dataset.emoji;
      const emoji2 = card2.dataset.emoji;

      if (emoji1 === emoji2) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        document.getElementById('pairsCount').textContent = `${matchedPairs} / ${emojis.length}`;
        flippedCards = [];

        if (matchedPairs === emojis.length) {
          clearInterval(timerInterval);
          setTimeout(() => {
            alert(`🎉 ¡Felicidades! Completaste el juego en ${moves} movimientos y ${timer} segundos.`);
          }, 300);
        }
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
        }, 900);
      }
    }

    document.getElementById('btnRestart').addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
