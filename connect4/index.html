<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 en Raya - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mode-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--bg-card);
      padding: 0.35rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .mode-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .status-panel {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      min-height: 2rem;
    }

    .board-wrapper {
      background: #1e293b;
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .connect4-board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      background: #0f172a;
      padding: 8px;
      border-radius: var(--radius-md);
    }

    .cell {
      aspect-ratio: 1;
      background: var(--bg-primary);
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
      border: 2px solid rgba(255, 255, 255, 0.05);
    }

    .cell:hover {
      border-color: var(--border-highlight);
    }

    .cell.red {
      background: radial-gradient(circle at 35% 35%, #f87171, #dc2626);
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
    }

    .cell.yellow {
      background: radial-gradient(circle at 35% 35%, #fde047, #ca8a04);
      box-shadow: 0 0 10px rgba(202, 138, 4, 0.5);
    }

    .scores {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-val {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <header class="link-header">
    <a href="../" class="btn-back">
      <span>← Volver al Catálogo</span>
    </a>
    <div class="link-logo">
      <div class="link-logo-icon">🟡</div>
      <span>4 en Raya</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">

      <div class="mode-selector">
        <button class="mode-btn active" id="btnVsAi">vs IA</button>
        <button class="mode-btn" id="btnVsP2">2 Jugadores</button>
      </div>

      <div class="status-panel" id="statusPanel" style="color: #ef4444;">Turno: Rojo</div>

      <div class="board-wrapper">
        <div class="connect4-board" id="board">
          <!-- 42 cells generated by JS -->
        </div>
      </div>

      <div class="scores">
        <div class="score-box">
          <span class="score-label">Rojo</span>
          <span class="score-val" id="scoreRed" style="color: #ef4444;">0</span>
        </div>
        <div class="score-box">
          <span class="score-label" id="labelYellow">Amarillo (IA)</span>
          <span class="score-val" id="scoreYellow" style="color: #eab308;">0</span>
        </div>
      </div>

      <button class="btn btn-secondary" id="btnReset" style="width: 100%;">Reiniciar Partida</button>

    </div>
  </main>

  <footer class="link-footer">
    <p>Licencia MIT — Link Minigames</p>
  </footer>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let board = [];
    let currentPlayer = 'red'; // 'red' or 'yellow'
    let gameActive = true;
    let vsAi = true;

    let scoreRed = 0;
    let scoreYellow = 0;

    const boardEl = document.getElementById('board');
    const statusPanel = document.getElementById('statusPanel');

    function initBoard() {
      board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => handleColumnClick(c));
          boardEl.appendChild(cell);
        }
      }
      gameActive = true;
      currentPlayer = 'red';
      updateStatus();
    }

    function updateStatus() {
      if (!gameActive) return;
      if (currentPlayer === 'red') {
        statusPanel.textContent = 'Turno: Rojo 🔴';
        statusPanel.style.color = '#ef4444';
      } else {
        statusPanel.textContent = vsAi ? 'Pensando la IA... 🟡' : 'Turno: Amarillo 🟡';
        statusPanel.style.color = '#eab308';
      }
    }

    function handleColumnClick(col) {
      if (!gameActive) return;
      if (vsAi && currentPlayer === 'yellow') return;

      dropPiece(col);
    }

    function dropPiece(col) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][col]) {
          board[r][col] = currentPlayer;
          updateUiCell(r, col, currentPlayer);

          if (checkWin(r, col, currentPlayer)) {
            gameActive = false;
            statusPanel.textContent = `¡Gana ${currentPlayer === 'red' ? 'Rojo' : 'Amarillo'}! 🎉`;
            if (currentPlayer === 'red') scoreRed++;
            else scoreYellow++;
            updateScores();
            return;
          }

          if (isBoardFull()) {
            gameActive = false;
            statusPanel.textContent = '¡Empate! 🤝';
            statusPanel.style.color = 'var(--text-primary)';
            return;
          }

          currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
          updateStatus();

          if (gameActive && vsAi && currentPlayer === 'yellow') {
            setTimeout(aiTurn, 400);
          }
          return;
        }
      }
    }

    function updateUiCell(r, c, player) {
      const idx = r * COLS + c;
      const cell = boardEl.children[idx];
      cell.classList.add(player);
    }

    function checkWin(r, c, player) {
      const directions = [
        [[0, 1], [0, -1]],  // Horizontal
        [[1, 0], [-1, 0]],  // Vertical
        [[1, 1], [-1, -1]], // Diag \
        [[1, -1], [-1, 1]]  // Diag /
      ];

      return directions.some(dirPair => {
        let count = 1;
        dirPair.forEach(([dr, dc]) => {
          let currR = r + dr;
          let currC = c + dc;
          while (
            currR >= 0 && currR < ROWS &&
            currC >= 0 && currC < COLS &&
            board[currR][currC] === player
          ) {
            count++;
            currR += dr;
            currC += dc;
          }
        });
        return count >= 4;
      });
    }

    function isBoardFull() {
      return board[0].every(cell => cell !== null);
    }

    function aiTurn() {
      if (!gameActive) return;

      // 1. Check if AI can win immediately
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmptyRow(c);
        if (r !== -1) {
          board[r][c] = 'yellow';
          if (checkWin(r, c, 'yellow')) {
            board[r][c] = null;
            dropPiece(c);
            return;
          }
          board[r][c] = null;
        }
      }

      // 2. Block opponent win
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmptyRow(c);
        if (r !== -1) {
          board[r][c] = 'red';
          if (checkWin(r, c, 'red')) {
            board[r][c] = null;
            dropPiece(c);
            return;
          }
          board[r][c] = null;
        }
      }

      // 3. Prefer central columns
      const preferredCols = [3, 2, 4, 1, 5, 0, 6];
      for (let c of preferredCols) {
        if (getLowestEmptyRow(c) !== -1) {
          dropPiece(c);
          return;
        }
      }
    }

    function getLowestEmptyRow(c) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][c]) return r;
      }
      return -1;
    }

    function updateScores() {
      document.getElementById('scoreRed').textContent = scoreRed;
      document.getElementById('scoreYellow').textContent = scoreYellow;
    }

    document.getElementById('btnReset').addEventListener('click', initBoard);

    document.getElementById('btnVsAi').addEventListener('click', () => {
      vsAi = true;
      document.getElementById('btnVsAi').classList.add('active');
      document.getElementById('btnVsP2').classList.remove('active');
      document.getElementById('labelYellow').textContent = 'Amarillo (IA)';
      initBoard();
    });

    document.getElementById('btnVsP2').addEventListener('click', () => {
      vsAi = false;
      document.getElementById('btnVsP2').classList.add('active');
      document.getElementById('btnVsAi').classList.remove('active');
      document.getElementById('labelYellow').textContent = 'Amarillo (Jugador 2)';
      initBoard();
    });

    initBoard();
  </script>
</body>
</html>
