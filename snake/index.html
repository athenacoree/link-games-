<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serpiente Classic - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }

    .canvas-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
    }

    canvas {
      width: 100%;
      height: auto;
      background: #0d1117;
      border-radius: var(--radius-md);
      display: block;
      touch-action: none;
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      background: var(--bg-card);
      padding: 0.875rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .score-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 240px;
      margin: 0 auto 1.5rem;
    }

    .dpad-btn {
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .dpad-btn:active {
      background: var(--accent-primary);
    }
  </style>
</head>
<body>

  <header class="link-header">
    <a href="../" class="btn-back">
      <span>← Volver al Catálogo</span>
    </a>
    <div class="link-logo">
      <div class="link-logo-icon">🐍</div>
      <span>Serpiente Classic</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">

      <div class="score-board">
        <div>
          <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Puntos</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div>
          <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">RRecord</div>
          <div class="score-val" id="highScore" style="color: #ec4899;">0</div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
      </div>

      <div class="dpad">
        <div></div>
        <button class="dpad-btn" id="btnUp">▲</button>
        <div></div>
        <button class="dpad-btn" id="btnLeft">◄</button>
        <div></div>
        <button class="dpad-btn" id="btnRight">►</button>
        <div></div>
        <button class="dpad-btn" id="btnDown">▼</button>
        <div></div>
      </div>

      <button class="btn btn-primary" id="btnStart" style="width: 100%;">Iniciar Juego</button>

    </div>
  </main>

  <footer class="link-footer">
    <p>Licencia MIT — Link Minigames</p>
  </footer>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    let gameInterval = null;
    let gameRunning = false;

    document.getElementById('highScore').textContent = highScore;

    function startGame() {
      clearInterval(gameInterval);
      snake = [{ x: 10, y: 10 }];
      generateFood();
      dx = 1;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      gameRunning = true;
      gameInterval = setInterval(gameLoop, 100);
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    }

    function gameLoop() {
      if (!gameRunning) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_highscore', highScore);
          document.getElementById('highScore').textContent = highScore;
        }
        generateFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid lines soft
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID_SIZE, (food.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#10b981' : '#34d399';
        ctx.fillRect(
          segment.x * GRID_SIZE + 1,
          segment.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2
        );
      });
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(gameInterval);
      alert(`💥 ¡Game Over! Conseguiste ${score} puntos.`);
    }

    function setDirection(newDx, newDy) {
      if (!gameRunning) return;
      if (newDx === -dx && newDx !== 0) return;
      if (newDy === -dy && newDy !== 0) return;
      dx = newDx;
      dy = newDy;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') setDirection(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') setDirection(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') setDirection(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') setDirection(1, 0);
    });

    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    // Touch swipe gestures
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 20) setDirection(1, 0);
        else if (diffX < -20) setDirection(-1, 0);
      } else {
        if (diffY > 20) setDirection(0, 1);
        else if (diffY < -20) setDirection(0, -1);
      }
    });

    document.getElementById('btnStart').addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
