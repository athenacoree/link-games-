<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luces Fuera - Link Minigames</title>
  <link rel="stylesheet" href="../assets/css/link-theme.css">
  <style>
    .game-container {
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      background: var(--bg-card);
      padding: 12px;
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
    }
    .light-btn {
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .light-btn.on {
      background: #f59e0b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body>
  <header class="link-header">
    <a href="../" class="btn-back"><span>← Volver al Catálogo</span></a>
    <div class="link-logo">
      <div class="link-logo-icon">💡</div>
      <span>Luces Fuera</span>
    </div>
  </header>

  <main class="container">
    <div class="game-container">
      <div style="margin-bottom:1rem; font-weight:bold;">Movimientos: <span id="moves" style="color:var(--accent-primary);">0</span></div>

      <div class="grid" id="grid"></div>

      <button class="btn btn-secondary" onclick="initGame()" style="width: 100%;">Nuevo Tablero</button>
    </div>
  </main>

  <footer class="link-footer"><p>Licencia MIT — Link Minigames</p></footer>

  <script>
    const SIZE = 5;
    let gridState = [];
    let moves = 0;

    function initGame() {
      gridState = Array(SIZE).fill(null).map(() => Array(SIZE).fill(false));
      moves = 0;
      document.getElementById('moves').textContent = moves;

      // Random puzzle setup
      for (let i = 0; i < 8; i++) {
        let r = Math.floor(Math.random() * SIZE);
        let c = Math.floor(Math.random() * SIZE);
        toggle(r, c, false);
      }
      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const btn = document.createElement('button');
          btn.className = 'light-btn' + (gridState[r][c] ? ' on' : '');
          btn.addEventListener('click', () => {
            toggle(r, c, true);
            render();
            checkWin();
          });
          grid.appendChild(btn);
        }
      }
    }

    function toggle(r, c, countMove) {
      if (countMove) {
        moves++;
        document.getElementById('moves').textContent = moves;
      }
      const coords = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
      coords.forEach(([cr, cc]) => {
        if (cr >= 0 && cr < SIZE && cc >= 0 && cc < SIZE) {
          gridState[cr][cc] = !gridState[cr][cc];
        }
      });
    }

    function checkWin() {
      const allOff = gridState.every(row => row.every(val => !val));
      if (allOff) {
        alert(`🎉 ¡Felicidades! Apagaste todas las luces en ${moves} movimientos.`);
      }
    }

    initGame();
  </script>
</body>
</html>
